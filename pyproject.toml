[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "readypack"
version = "0.2.0"
description = "Package a dataset with its findings reports into a documented pack: data-health score, datasheet, Croissant metadata, and changelog."
readme = "README.md"
license = "MIT"
authors = [{ name = "hexsyro", email = "hexsyro@gmail.com" }]
requires-python = ">=3.10"
dependencies = []
keywords = ["dataset", "datasheet", "croissant", "data-card", "packaging", "reproducibility"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Information Analysis",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
readypack = "readypack.cli:main"

[project.urls]
Homepage = "https://github.com/hexsyro/ReadyPack"
Repository = "https://github.com/hexsyro/ReadyPack"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]


[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "PIE", "RUF"]
# RUF001: intentional non-Latin glyphs in language tables, detection tests, and
# mojibake-handling fixtures.
ignore = ["RUF001"]

[tool.ruff.lint.per-file-ignores]
# E402: a couple of tests adjust sys.path before importing the package.
"tests/**" = ["E402"]


[tool.pyright]
include = ["src"]
extraPaths = ["src"]
pythonVersion = "3.10"
typeCheckingMode = "basic"


[tool.pylint.format]
# Keep Pylint consistent with the 120-character limit used by Ruff.
max-line-length = 120

[tool.pylint."messages control"]
# ReadyPack uses Ruff for style. These Pylint-only rules mandate docstrings on
# every tiny helper/test and penalize intentionally data-heavy exporter APIs.
disable = [
  "missing-module-docstring",
  "missing-class-docstring",
  "missing-function-docstring",
  "too-many-arguments",
  "too-many-locals",
  "too-many-branches",
  "too-many-statements",
  "too-many-return-statements",
  "too-few-public-methods",
  "duplicate-code",
  "broad-exception-caught",
  "protected-access",
  "too-many-positional-arguments",
  "too-many-instance-attributes",
]

[tool.pylint.typecheck]
# pytest is a dev dependency, not a runtime dependency.
ignored-modules = ["pytest"]
