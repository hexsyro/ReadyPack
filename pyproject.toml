[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "readypack"
version = "0.1.0"
description = "Package a dataset with its findings reports into a documented pack: data-health score, datasheet, Croissant metadata, and changelog."
readme = "README.md"
license = "MIT"
authors = [{ name = "hexsyro", email = "hexsyro@gmail.com" }]
requires-python = ">=3.10"
dependencies = []
keywords = ["dataset", "datasheet", "croissant", "data-card", "packaging", "reproducibility"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Information Analysis",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
readypack = "readypack.cli:main"

[project.urls]
Homepage = "https://github.com/hexsyro/ReadyPack"
Repository = "https://github.com/hexsyro/ReadyPack"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
